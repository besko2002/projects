server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      # Never let a client-supplied X-Forwarded-Host/-Port steer redirects or Location headers
      # (the proxy sets Host itself; absolute links use APP_BASE_URL).
      host-header: ''
      port-header: ''
      # Peers allowed to set X-Forwarded-For/-Proto. Default: loopback only (a reverse proxy on the same
      # host). Private ranges are NOT trusted by default: a client on a LAN/VPN/container network could
      # otherwise forge X-Forwarded-For and pick its own rate-limit bucket (CB-31). If the proxy runs
      # on another host or container, set TRUSTED_PROXIES to a regex for its exact address(es).
      internal-proxies: '${TRUSTED_PROXIES:127\.\d{1,3}\.\d{1,3}\.\d{1,3}|::1|0:0:0:0:0:0:0:1}'

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

