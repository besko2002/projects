name: movie-reservation-system

on:
  push:
    branches: [main]
    paths:
      - 'movie-reservation-system/**'
      - '.github/workflows/movie-reservation-system.yml'
  pull_request:
    paths:
      - 'movie-reservation-system/**'
      - '.github/workflows/movie-reservation-system.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: movie-reservation-system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'movie-reservation-system/frontend/package-lock.json'

      - name: Build and test frontend
        working-directory: movie-reservation-system/frontend
        run: |
          npm ci
          npm run build
          npm run lint
          npm test -- --run

      - name: Verify static bundle freshness
        run: |
          rm -rf src/main/resources/static/assets
          cp -r frontend/dist/assets src/main/resources/static/
          cp frontend/dist/index.html src/main/resources/static/
          if [ -n "$(git status --porcelain src/main/resources/static)" ]; then
            echo "Stale bundle detected in src/main/resources/static! Rebuild frontend and commit static assets."
            git diff src/main/resources/static
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'movie-reservation-system/**/pom.xml'

      # Testcontainers starts PostgreSQL through the Docker daemon on the runner.
      - name: Build and run tests
        env:
          MAVEN_OPTS: "-Xmx512m"
        run: ./mvnw -B clean verify -DargLine="-Xmx512m"
