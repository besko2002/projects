name: movie-reservation-system

on:
  push:
    branches: [main]
    paths:
      - 'movie-reservation-system/**'
      - '.github/workflows/movie-reservation-system.yml'
  pull_request:
    paths:
      - 'movie-reservation-system/**'
      - '.github/workflows/movie-reservation-system.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: movie-reservation-system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'movie-reservation-system/**/pom.xml'

      # Testcontainers starts PostgreSQL through the Docker daemon on the runner.
      - name: Build and run tests
        run: ./mvnw -B clean verify
