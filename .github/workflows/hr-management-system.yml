name: hr-management-system

on:
  push:
    branches: [main]
    paths:
      - 'hr-management-system/**'
      - '.github/workflows/hr-management-system.yml'
  pull_request:
    paths:
      - 'hr-management-system/**'
      - '.github/workflows/hr-management-system.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hr-management-system
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'hr-management-system/**/pom.xml'

      # Testcontainers starts PostgreSQL through the runner's Docker daemon.
      - name: Build and run all tests
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hr-management-system/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hr-management-system/frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Disposable test credentials are required when Compose parses both up and down.
    env:
      DB_PASSWORD: e2e-db-password-7hJ3
      JWT_SECRET: e2e-hr-secret-0123456789abcdef-0123456789
      HR_ADMIN_PASSWORD: E2eAdmin@2026
      HR_ADMIN_EMAIL: admin@hr.local
    defaults:
      run:
        working-directory: hr-management-system
    steps:
      - uses: actions/checkout@v7

      - name: Start isolated e2e stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p hr-e2e --profile app up -d --build --wait

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hr-management-system/frontend/package-lock.json

      - name: Install dependencies
        working-directory: hr-management-system/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: hr-management-system/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: hr-management-system/frontend
        run: npm run e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:5176
          E2E_ADMIN_EMAIL: admin@hr.local
          E2E_ADMIN_PASSWORD: E2eAdmin@2026

      - name: Teardown isolated e2e stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p hr-e2e down -v
