name: order-processing-microservices

on:
  push:
    branches: [main]
    paths:
      - 'order-processing-microservices/**'
      - '.github/workflows/order-processing-microservices.yml'
  pull_request:
    paths:
      - 'order-processing-microservices/**'
      - '.github/workflows/order-processing-microservices.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: order-processing-microservices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'order-processing-microservices/**/pom.xml'

      # Testcontainers starts PostgreSQL, Kafka and Redis through the runner's Docker daemon.
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Test report
        if: always()
        run: |
          for f in */target/surefire-reports/*.txt; do grep -h "Tests run" "$f"; done | \
            awk -F'[ ,]+' '{t+=$3; f+=$5; e+=$7} END {print "Tests: "t", failures: "f", errors: "e}'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: order-processing-microservices/storefront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: order-processing-microservices/storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
