      #       cd /opt/hr-management-system
      #       export APP_IMAGE="ghcr.io/${{ github.repository_owner }}/hr-management-app:${{ github.sha }}"
      #       export FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/hr-management-frontend:${{ github.sha }}"
