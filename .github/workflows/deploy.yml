name: Deploy HR Management System

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Container image tag (defaults to git commit sha)'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          USER_TAG="${{ github.event.inputs.image_tag }}"
          TAG="${USER_TAG:-$SHA_TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: hr-management-system
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/hr-management-app:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/hr-management-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: hr-management-system/frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/hr-management-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/hr-management-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ vars.DOMAIN || 'hr.example.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Production Environment
        run: |
          echo "Deploying release tag: ${{ needs.build-and-push.outputs.tag || github.sha }}"
          echo "Target Domain: ${{ vars.DOMAIN || 'hr.example.com' }}"

      # In production, deploy over SSH / Docker Context to the target host:
      # - name: Deploy Compose Stack
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.PROD_HOST }}
      #     username: ${{ secrets.PROD_USER }}
      #     key: ${{ secrets.PROD_SSH_KEY }}
