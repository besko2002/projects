name: ai-document-assistant

on:
  push:
    branches: [main]
    paths:
      - 'ai-document-assistant/**'
      - '.github/workflows/ai-document-assistant.yml'
  pull_request:
    paths:
      - 'ai-document-assistant/**'
      - '.github/workflows/ai-document-assistant.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-document-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'ai-document-assistant/**/pom.xml'
      # Testcontainers starts a real PostgreSQL + pgvector through the runner's Docker daemon.
      # The AI providers are faked in the tests, so no API key is needed.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-document-assistant/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-document-assistant/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
