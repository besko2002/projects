server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USER:payment_user}
    password: ${PAYMENT_DB_PASSWORD:payment_local_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      # Raw strings: service-support's EventEnvelopeReader picks the payload type from the eventType
      # header, so a malformed record becomes a classifiable failure instead of a deserialisation
      # error inside the container.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

# ---------------------------------------------------------------- reliability (service-support)
# Tables: V2__create_payments.sql in this service's own database.
outbox:
  enabled: true
  aggregate-type: Payment
  poll-interval-ms: ${OUTBOX_POLL_MS:500}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  send-timeout: ${OUTBOX_SEND_TIMEOUT:PT15S}
  retention: ${OUTBOX_RETENTION:P7D}
  cleanup-interval-ms: ${OUTBOX_CLEANUP_MS:3600000}
  scheduler-enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
  producer:
    max-block-ms: ${OUTBOX_PRODUCER_MAX_BLOCK_MS:5000}
    request-timeout-ms: ${OUTBOX_PRODUCER_REQUEST_TIMEOUT_MS:5000}
    delivery-timeout-ms: ${OUTBOX_PRODUCER_DELIVERY_TIMEOUT_MS:10000}

idempotency:
  enabled: true
  retention: ${PROCESSED_EVENTS_RETENTION:P7D}
  cleanup-interval-ms: ${PROCESSED_EVENTS_CLEANUP_MS:3600000}

messaging:
  consumer:
    enabled: true
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
    retries: ${KAFKA_CONSUMER_RETRIES:3}
    initial-backoff-ms: ${KAFKA_CONSUMER_BACKOFF_MS:500}
    backoff-multiplier: ${KAFKA_CONSUMER_BACKOFF_MULTIPLIER:2.0}
    max-backoff-ms: ${KAFKA_CONSUMER_MAX_BACKOFF_MS:4000}

payments:
  # Attempts per command before an optimistic-locking conflict is given up on.
  max-attempts: ${PAYMENT_MAX_ATTEMPTS:3}
  # Which provider handles charges: "stripe" (or any sk_test_ key present) selects the real
  # StripePaymentGateway; "simulated" selects the deterministic local one; with neither, the
  # UnavailablePaymentGateway answers and every charge fails with a clear reason — a missing key is
  # never a fake success. The simulated provider is never a fallback for Stripe.
  provider: ${PAYMENT_PROVIDER:}
  # Real Stripe, test mode only. STRIPE_SECRET_KEY must start with sk_test_ — a key that does not is
  # refused outright (this application is test-mode only; there is no override).
  # STRIPE_WEBHOOK_SECRET is the whsec_... of THIS service's webhook endpoint (locally: the secret
  # printed by `stripe listen`); a wrong secret makes every webhook delivery a 400, so payment
  # rows keep waiting for the customer and the saga's timeout compensates them.
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Where the hosted checkout sends the customer back; the storefront passes its own return URLs,
  # this is the fallback root for API-driven use.
  storefront-base-url: ${STOREFRONT_BASE_URL:http://localhost:5179}
  # How long a hosted checkout stays payable. The saga's own timeout stays the authority over
  # abandoned checkouts; this only bounds what Stripe keeps open (its minimum is 30 minutes).
  checkout-ttl: ${PAYMENT_CHECKOUT_TTL:PT30M}
  # The simulated provider. Deterministic on purpose: the failure branch of the saga has to be
  # triggerable on demand, and a redelivered charge must reach the same verdict as the first one.
  # PAYMENT_DECLINE_ABOVE: every amount above this is declined (the "payment declined" demo).
  # PAYMENT_FAILURE_RATE: share of orders (0..1) declined regardless of amount, chosen from a hash
  # of the order id rather than at random. These knobs do nothing for the Stripe provider.
  decline-above: ${PAYMENT_DECLINE_ABOVE:1000.00}
  failure-rate: ${PAYMENT_FAILURE_RATE:0}
  # Currency every checkout is asked in (Stripe needs minor units; conversion uses ISO fraction
  # digits, so this must be a real ISO 4217 code).
  currency: ${STRIPE_CURRENCY:EUR}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Only the span export is switchable; tracing itself (trace ids, propagation) stays on.
      # docker-compose.yml turns it off for the containers unless Jaeger is wanted.
      export:
        enabled: ${OTLP_TRACING_EXPORT_ENABLED:true}
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.orders: ${LOG_LEVEL_APP:INFO}
  pattern:
    # Spring Boot splices this into the default console pattern, so every log line carries the
    # correlation id of the request that started the saga (service-support puts it in the MDC, for an
    # HTTP request through the filter and for a consumed record through the Kafka interceptor).
    correlation: "[${spring.application.name:payment-service},%X{correlationId:-},%X{traceId:-}] "
